name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add missing Flutter Windows scaffolding (behoudt onze aanpassingen)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _darktask_backup | Out-Null
          Copy-Item windows\runner\CMakeLists.txt _darktask_backup\ -Force
          Copy-Item windows\runner\runner.exe.manifest _darktask_backup\ -Force
          Copy-Item windows\runner\resources -Destination _darktask_backup\resources -Recurse -Force
          flutter create --platforms=windows .
          Copy-Item _darktask_backup\CMakeLists.txt windows\runner\CMakeLists.txt -Force
          Copy-Item _darktask_backup\runner.exe.manifest windows\runner\runner.exe.manifest -Force
          Copy-Item _darktask_backup\resources\* windows\runner\resources\ -Force -Recurse
          Remove-Item _darktask_backup -Recurse -Force

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkTask-windows
          path: build/windows/x64/runner/Release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libnotify-dev libayatana-appindicator3-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add Linux scaffolding
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          CXXFLAGS: "-Wno-error=deprecated-declarations"
        run: flutter build linux --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkTask-linux
          path: build/linux/x64/release/bundle/
